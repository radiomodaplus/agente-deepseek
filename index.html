<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Comercial & Soporte - Gemini IA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .config-box {
            margin-bottom: 15px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e1e1e1;
        }
        .config-box label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: #555;
        }
        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .config-header button {
            background: none;
            border: none;
            color: #007bff;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }
        .config-box input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #api-container {
            display: block;
        }
        #chat-box {
            height: 380px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            overflow-y: scroll;
            background: #fafafa;
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 14px;
        }
        .user-message {
            background: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .ai-message {
            background: #e4e6eb;
            color: #333;
            margin-right: auto;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-group button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .input-group button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Asistente Comercial & Soporte</h2>
    <div class="subtitle">Atención al cliente y ventas en tiempo real (Google Gemini)</div>
    
    <div class="config-box">
        <div class="config-header">
            <label for="apiKey">Configuración de API (Gemini):</label>
            <button onclick="toggleApiBox()">Ocultar / Mostrar</button>
        </div>
        <div id="api-container">
            <input type="password" id="apiKey" value="" placeholder="Pega tu API Key de Gemini aquí">
        </div>
    </div>

    <div id="chat-box">
        <div class="message ai-message">¡Hola! 👋 Bienvenido a nuestro servicio de atención al cliente y soporte. ¿En qué puedo colaborarte o guiarte en tu compra el día de hoy?</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." onkeypress="handleKeyPress(event)">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>
</div>

<script>
    const systemInstruction = "Eres un agente de IA experto y profesional en atención al cliente, soporte técnico y ventas. Tu tono es sumamente amable, empático, claro y orientado a resolver problemas paso a paso o a guiar al cliente hacia la mejor decisión de compra.";

    function toggleApiBox() {
        const box = document.getElementById('api-container');
        box.style.display = (box.style.display === 'none') ? 'block' : 'none';
    }

    async function enviarMensaje() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chat-box');
        const mensajeTexto = userInput.value.trim();

        if (!apiKey) {
            alert('Por favor, ingresa tu API Key de Gemini en la casilla superior.');
            return;
        }
        if (!mensajeTexto) return;

        chatBox.innerHTML += `<div class="message user-message">${escapeHtml(mensajeTexto)}</div>`;
        userInput.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai-message">Analizando respuesta...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Modelo actualizado correctamente a gemini-1.5-flash
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [
                        {
                            role: "user",
                            parts: [
                                { text: systemInstruction + "\n\nCliente: " + mensajeTexto }
                            ]
                        }
                    ]
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.candidates && data.candidates.length > 0) {
                const respuestaIA = data.candidates[0].content.parts[0].text;
                chatBox.innerHTML += `<div class="message ai-message">${escapeHtml(respuestaIA).replace(/\n/g, '<br>')}</div>`;
            } else {
                const errorMsg = data.error ? data.error.message : 'Error desconocido en la respuesta.';
                chatBox.innerHTML += `<div class="message ai-message" style="color:red;">Error de API: ${escapeHtml(errorMsg)}</div>`;
            }
        } catch (error) {
            const el = document.getElementById(loadingId);
            if (el) el.remove();
            chatBox.innerHTML += `<div class="message ai-message" style="color:red;">Error de red: ${escapeHtml(error.message)}</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            enviarMensaje();
        }
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
</script>

</body>
</html>
