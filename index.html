<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Comercial & Soporte - DeepSeek</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .config-box {
            margin-bottom: 15px;
        }
        .config-box label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .config-box input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #chat-box {
            height: 380px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            overflow-y: scroll;
            background: #fafafa;
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 14px;
        }
        .user-message {
            background: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .ai-message {
            background: #e4e6eb;
            color: #333;
            margin-right: auto;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-group button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .input-group button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Asistente Comercial & Soporte</h2>
    <div class="subtitle">Atención al cliente en tiempo real</div>
    
    <div class="config-box">
        <label for="apiKey">Tu API Key de DeepSeek:</label>
        <input type="password" id="apiKey" value="sk-5d265601bdb64c5fa53245258c1eb57f" placeholder="Pega tu API Key aquí de forma segura">
    </div>

    <div id="chat-box">
        <div class="message ai-message">¡Hola! 👋 Bienvenido a nuestro canal de soporte y ventas. ¿En qué puedo colaborarte el día de hoy?</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Escribe tu consulta..." onkeypress="handleKeyPress(event)">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>
</div>

<script>
    let historialConversacion = [
        { 
            role: "system", 
            content: "Eres un agente de IA experto en atención al cliente, soporte técnico y ventas. Tu tono es sumamente amable, empático, claro y orientado a resolver problemas o concretar ventas de manera profesional." 
        }
    ];

    async function enviarMensaje() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chat-box');
        const mensajeTexto = userInput.value.trim();

        if (!apiKey) {
            alert('Por favor, ingresa tu API Key de DeepSeek en la casilla superior.');
            return;
        }
        if (!mensajeTexto) return;

        // Mostrar mensaje del usuario
        chatBox.innerHTML += `<div class="message user-message">${escapeHtml(mensajeTexto)}</div>`;
        userInput.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        historialConversacion.push({ role: "user", content: mensajeTexto });

        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai-message">Buscando solución...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: historialConversacion,
                    stream: false
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.choices && data.choices.length > 0) {
                const respuestaIA = data.choices[0].message.content;
                chatBox.innerHTML += `<div class="message ai-message">${escapeHtml(respuestaIA).replace(/\n/g, '<br>')}</div>`;
                historialConversacion.push({ role: "assistant", content: respuestaIA });
            } else {
                const errorMsg = data.error ? data.error.message : 'Error desconocido en la respuesta.';
                chatBox.innerHTML += `<div class="message ai-message" style="color:red;">Error de API: ${escapeHtml(errorMsg)}</div>`;
            }
        } catch (error) {
            const el = document.getElementById(loadingId);
            if (el) el.remove();
            chatBox.innerHTML += `<div class="message ai-message" style="color:red;">Error de conexión: ${escapeHtml(error.message)}</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            enviarMensaje();
        }
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
</script>

</body>
</html>
